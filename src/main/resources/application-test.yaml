# Configuración específica para pruebas
server:
  port: 0  # Puerto aleatorio para pruebas

spring:
  config:
    activate:
      on-profile: test

  # R2DBC Configuration (Reactive PostgreSQL)
  r2dbc:
    url: ${DB_R2DBC_URL_TEST}
    username: ${DB_USERNAME_TEST}
    password: ${DB_PASSWORD_TEST}
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 10m
      max-create-connection-time: 30s
      max-acquire-time: 30s
      max-life-time: 30m
      validation-depth: LOCAL
    properties:
      sslMode: ${DB_SSL_MODE_TEST:require}
      connectTimeout: PT30S
      statementTimeout: PT60S
      lockTimeout: PT10S

  # MongoDB (test) - Connection (Testcontainers)
  mongodb:
    uri: ${MONGODB_URI_TEST:mongodb://localhost:27017/fantasy_sports_hub_test}
    mongodb:
      auto-index-creation: true

    # Redis (test) - Lettuce connection (Testcontainers)
    redis:
      host: ${SPRING_DATA_REDIS_HOST_TEST:localhost}
      port: ${SPRING_DATA_REDIS_PORT_TEST:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD_TEST:}
      database: ${SPRING_DATA_REDIS_DATABASE_TEST:0}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT_TEST:2000}
      client-name: ${SPRING_DATA_REDIS_CLIENT_NAME_TEST:fantasy-sports-redis-test}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED_TEST:false}
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE_TEST:8}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE_TEST:8}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE_TEST:2}
          max-wait: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT_TEST:3000ms}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fantasy-sport-hub-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


# Configuración de TestContainers para pruebas
testcontainers:
  mongodb:
    image: mongo:latest
    expose:
      - "27017"
  kafka:
    image: confluentinc/cp-kafka:latest
    expose:
      - "9092"
  eventstoredb:
    image: eventstore/eventstore:latest
    expose:
      - "2113"
      - "1113"

# Configuración de logging para pruebas
logging:
  level:
    root: INFO
    org.springframework.test: DEBUG
    com.fantasy.sport: DEBUG
    org.testcontainers: INFO
    org.mongodb: DEBUG
