# Configuración específica para producción
server:
  port: 8080
  
spring:
  config:
    activate:
      on-profile: prod

  # R2DBC Configuration (Reactive PostgreSQL)
  r2dbc:
    url: ${DB_R2DBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 10m
      max-create-connection-time: 30s
      max-acquire-time: 30s
      max-life-time: 30m
      validation-depth: LOCAL
    properties:
      sslMode: ${DB_SSL_MODE:require}
      connectTimeout: PT30S
      statementTimeout: PT60S
      lockTimeout: PT10S

  # MongoDB Atlas (prod) - Connection
  mongodb:
    uri: ${MONGODB_URI_PROD}
    mongodb:
      auto-index-creation: true

    # Redis Cloud (prod) - Lettuce connection
    redis:
      host: ${SPRING_DATA_REDIS_HOST_PROD}
      port: ${SPRING_DATA_REDIS_PORT_PROD}
      username: ${SPRING_DATA_REDIS_USERNAME_PROD}
      password: ${SPRING_DATA_REDIS_PASSWORD_PROD}
      database: ${SPRING_DATA_REDIS_DATABASE_PROD}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT_PROD}
      client-name: ${SPRING_DATA_REDIS_CLIENT_NAME_PROD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED_PROD}
      lettuce:
        pool:
          max-active: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE_PROD}
          max-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE_PROD}
          min-idle: ${SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE_PROD}
          max-wait: ${SPRING_DATA_REDIS_LETTUCE_POOL_MAX_WAIT_PROD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-prod:9092}
    consumer:
      group-id: fantasy-sport-hub-prod-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        security.protocol: SSL
        ssl.truststore.location: /etc/ssl/certs/kafka.client.truststore.jks
        ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer


# Configuración de EventStoreDB para producción
eventstore:
  connection-string: ${EVENTSTORE_CONNECTION_STRING:esdb://prod-user:${EVENTSTORE_PASSWORD}@eventstoredb-prod:2113?tls=true}
  http-port: 2113
  tcp-port: 1113
  username: prod-user
  password: your_secure_password_here

# Configuración de seguridad
management:
  endpoints:
    web:
      base-path: /manage
  endpoint:
    health:
      show-details: when-authorized

# Configuración de logging para producción
logging:
  level:
    root: WARN
    com.fantasy.sport: INFO
  file:
    name: /var/log/fantasy-sport-hub/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

# Configuración de Resilience4j para producción
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 100
        permittedNumberOfCallsInHalfOpenState: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 20
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  ratelimiter:
    instances:
      default:
        limitForPeriod: 1000
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
